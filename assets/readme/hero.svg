<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">PGE Energy for Home Assistant</title>
  <desc id="desc">Home Assistant custom integration that imports Portland General Electric usage, cost, and outdoor temperature into the Energy dashboard and a first-party /pge panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>

  <!-- Recurring motif: faint interval bars rising from the bottom edge -->
  <g fill="#2A78D6" opacity="0.06">
    <rect x="16" y="330" width="20" height="70" rx="4"/>
    <rect x="62" y="356" width="20" height="44" rx="4"/>
    <rect x="108" y="318" width="20" height="82" rx="4"/>
    <rect x="154" y="344" width="20" height="56" rx="4"/>
    <rect x="200" y="322" width="20" height="78" rx="4"/>
    <rect x="246" y="358" width="20" height="42" rx="4"/>
    <rect x="292" y="336" width="20" height="64" rx="4"/>
    <rect x="338" y="350" width="20" height="50" rx="4"/>
    <rect x="384" y="326" width="20" height="74" rx="4"/>
    <rect x="430" y="360" width="20" height="40" rx="4"/>
    <rect x="476" y="334" width="20" height="66" rx="4"/>
    <rect x="522" y="312" width="20" height="88" rx="4"/>
    <rect x="568" y="348" width="20" height="52" rx="4"/>
    <rect x="820" y="330" width="20" height="70" rx="4"/>
    <rect x="866" y="352" width="20" height="48" rx="4"/>
    <rect x="912" y="340" width="20" height="60" rx="4"/>
    <rect x="958" y="320" width="20" height="80" rx="4"/>
    <rect x="1004" y="354" width="20" height="46" rx="4"/>
    <rect x="1050" y="338" width="20" height="62" rx="4"/>
    <rect x="1096" y="346" width="20" height="54" rx="4"/>
    <rect x="1142" y="322" width="20" height="78" rx="4"/>
  </g>

  <!-- Title block -->
  <g id="title-block" transform="translate(48 0)">
    <text x="0" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2.5" fill="#6F8BC4">HOME ASSISTANT CUSTOM INTEGRATION</text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="86" font-weight="800" fill="#F4F7FD">PGE Energy</text>
    <text x="0" y="204" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="46" font-weight="600" fill="#9FB0D4">for Home Assistant</text>
    <line x1="0" y1="240" x2="552" y2="240" stroke="#1F2C47" stroke-width="2"/>
    <text x="0" y="276" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#A6B7D8">Portland General Electric usage, cost, and</text>
    <text x="0" y="306" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#A6B7D8">outdoor temperature — in your Home Assistant</text>
    <text x="0" y="336" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#A6B7D8">Energy dashboard and the first-party /pge panel.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9FB6DC">
      <rect x="0" y="362" width="86" height="40" rx="8" fill="#16213B" stroke="#23304F"/>
      <text x="43" y="387" text-anchor="middle">HACS</text>
      <rect x="98" y="362" width="104" height="40" rx="8" fill="#16213B" stroke="#23304F"/>
      <text x="150" y="387" text-anchor="middle">v0.7.4</text>
      <rect x="214" y="362" width="152" height="40" rx="8" fill="#16213B" stroke="#23304F"/>
      <text x="290" y="387" text-anchor="middle">HA 2026.7.0+</text>
      <rect x="378" y="362" width="200" height="40" rx="8" fill="#16213B" stroke="#23304F"/>
      <text x="478" y="387" text-anchor="middle">Oregon · not PG&amp;E</text>
    </g>
  </g>

  <!-- Panel preview card -->
  <g id="panel-preview">
    <rect x="636" y="48" width="516" height="300" rx="16" fill="#111A2E" stroke="#1E2A47"/>
    <text x="676" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#C7D6F2">PGE · Yesterday</text>
    <text x="1116" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5E7399">24h · Pacific</text>

    <!-- 24-hour usage bars: closed intervals through yesterday, today open -->
    <g fill="#2A78D6">
      <rect x="676" y="260" width="18" height="18" rx="3"/>
      <rect x="698" y="262" width="18" height="16" rx="3"/>
      <rect x="720" y="258" width="18" height="20" rx="3"/>
      <rect x="742" y="252" width="18" height="26" rx="3"/>
      <rect x="764" y="242" width="18" height="36" rx="3"/>
      <rect x="786" y="224" width="18" height="54" rx="3"/>
      <rect x="808" y="202" width="18" height="76" rx="3"/>
      <rect x="830" y="180" width="18" height="98" rx="3"/>
      <rect x="852" y="154" width="18" height="124" rx="3"/>
      <rect x="874" y="188" width="18" height="90" rx="3"/>
      <rect x="896" y="212" width="18" height="66" rx="3"/>
      <rect x="918" y="224" width="18" height="54" rx="3"/>
      <rect x="940" y="218" width="18" height="60" rx="3"/>
      <rect x="962" y="210" width="18" height="68" rx="3"/>
      <rect x="984" y="218" width="18" height="60" rx="3"/>
      <rect x="1006" y="224" width="18" height="54" rx="3"/>
      <rect x="1028" y="216" width="18" height="62" rx="3"/>
      <rect x="1050" y="232" width="18" height="46" rx="3"/>
      <rect x="1072" y="242" width="18" height="36" rx="3"/>
    </g>
    <rect x="1094" y="250" width="18" height="28" rx="3" fill="none" stroke="#2A78D6" stroke-width="2" stroke-dasharray="5 4" opacity="0.75"/>

    <polyline points="685,268 707,269 729,267 751,264 773,258 795,248 817,236 839,224 861,210 883,228 905,242 927,248 949,245 971,240 993,245 1015,248 1037,244 1059,253 1081,258 1103,263"
              fill="none" stroke="#EB6834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="676" y1="280" x2="1116" y2="280" stroke="#1E2A47" stroke-width="2"/>

    <line x1="676" y1="292" x2="1116" y2="292" stroke="#1E2A47"/>
    <rect x="676" y="301" width="14" height="14" rx="3" fill="#2A78D6"/>
    <text x="698" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9FB6DC">kWh</text>
    <line x1="756" y1="308" x2="778" y2="308" stroke="#EB6834" stroke-width="3"/>
    <text x="786" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9FB6DC">cost</text>
    <text x="1116" y="313" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5E7399">closed through yesterday · today open</text>
  </g>
</svg>
