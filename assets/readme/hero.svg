<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">PGE Energy for Home Assistant</title>
  <desc id="desc">Home Assistant custom integration that imports Portland General Electric usage, cost, billing, and Time of Day pricing into the Energy dashboard and a first-party /pge panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#080e1a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- Left: title -->
  <g transform="translate(56 0)">
    <text x="0" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#4A6A96">HOME ASSISTANT CUSTOM INTEGRATION</text>
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="80" font-weight="800" fill="#F0F4FB">PGE Energy</text>
    <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="40" font-weight="500" fill="#7B9CC0">for Home Assistant</text>
    <line x1="0" y1="214" x2="440" y2="214" stroke="#1A2540" stroke-width="1.5"/>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#8499B8">Usage, cost, billing, and Time of Day pricing</text>
    <text x="0" y="278" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#8499B8">from Portland General Electric in your Energy dashboard.</text>
  </g>

  <!-- Right: usage chart -->
  <g transform="translate(620 36)">
    <rect x="0" y="0" width="524" height="288" rx="14" fill="#0C1320" stroke="#172036"/>

    <!-- Chart title -->
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="600" fill="#C0D0E8">Yesterday · 24h</text>
    <text x="500" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3E5678">Pacific</text>

    <!-- Grid lines -->
    <g stroke="#141C2E" stroke-width="1">
      <line x1="24" y1="240" x2="492" y2="240"/>
      <line x1="24" y1="190" x2="492" y2="190"/>
      <line x1="24" y1="140" x2="492" y2="140"/>
      <line x1="24" y1="90" x2="492" y2="90"/>
    </g>

    <!-- Hourly usage bars (24 bars, midnight to 11pm) -->
    <g fill="#2A78D6">
      <rect x="32"  y="228" width="16" height="12" rx="3"/>
      <rect x="52"  y="232" width="16" height="8"  rx="3"/>
      <rect x="72"  y="226" width="16" height="14" rx="3"/>
      <rect x="92"  y="220" width="16" height="20" rx="3"/>
      <rect x="112" y="210" width="16" height="30" rx="3"/>
      <rect x="132" y="194" width="16" height="46" rx="3"/>
      <rect x="152" y="176" width="16" height="64" rx="3"/>
      <rect x="172" y="156" width="16" height="84" rx="3"/>
      <rect x="192" y="134" width="16" height="106" rx="3"/>
      <rect x="212" y="152" width="16" height="88" rx="3"/>
      <rect x="232" y="170" width="16" height="70" rx="3"/>
      <rect x="252" y="182" width="16" height="58" rx="3"/>
      <rect x="272" y="176" width="16" height="64" rx="3"/>
      <rect x="292" y="168" width="16" height="72" rx="3"/>
      <rect x="312" y="174" width="16" height="66" rx="3"/>
      <rect x="332" y="180" width="16" height="60" rx="3"/>
      <rect x="352" y="176" width="16" height="64" rx="3"/>
      <rect x="372" y="186" width="16" height="54" rx="3"/>
      <rect x="392" y="196" width="16" height="44" rx="3"/>
      <rect x="412" y="208" width="16" height="32" rx="3"/>
      <rect x="432" y="216" width="16" height="24" rx="3"/>
      <rect x="452" y="222" width="16" height="18" rx="3"/>
      <rect x="472" y="228" width="16" height="12" rx="3"/>
    </g>

    <!-- Tomorrow (open) -->
    <rect x="492" y="230" width="16" height="10" rx="3" fill="none" stroke="#2A78D6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

    <!-- Cost line -->
    <polyline points="40,230 60,232 80,229 100,225 120,218 140,208 160,194 180,178 200,160 220,172 240,186 260,196 280,190 300,184 320,188 340,192 360,188 380,198 400,206 420,216 440,224 460,228 480,232"
              fill="none" stroke="#EB6834" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Legend -->
    <line x1="24" y1="264" x2="44" y2="264" stroke="#2A78D6" stroke-width="8" stroke-linecap="round"/>
    <text x="52" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6880A0">kWh</text>
    <line x1="110" y1="264" x2="130" y2="264" stroke="#EB6834" stroke-width="2.5"/>
    <text x="138" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6880A0">cost</text>
    <text x="492" y="268" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3E5678">closed through yesterday · today open</text>
  </g>

  <!-- Subtle bar motif along bottom -->
  <g fill="#2A78D6" opacity="0.04">
    <rect x="56"  y="320" width="14" height="28" rx="3"/>
    <rect x="86"  y="326" width="14" height="22" rx="3"/>
    <rect x="116" y="316" width="14" height="32" rx="3"/>
    <rect x="146" y="322" width="14" height="26" rx="3"/>
    <rect x="176" y="312" width="14" height="36" rx="3"/>
    <rect x="206" y="328" width="14" height="20" rx="3"/>
    <rect x="236" y="318" width="14" height="30" rx="3"/>
  </g>
</svg>
