<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">How PGE Energy syncs into Home Assistant</title>
  <desc id="desc">Three stages: unattended email/password login, tiered hourly/daily/monthly import into dual-published statistics, then Home Assistant Energy and the /pge panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5F85"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>

  <!-- Stage 1: Login -->
  <g id="stage-login">
    <rect x="48" y="40" width="4" height="236" rx="2" fill="#2A78D6"/>
    <rect x="52" y="40" width="348" height="236" rx="16" fill="#111A2E" stroke="#1E2A47"/>
    <circle cx="104" cy="88" r="13" fill="#14203A" stroke="#2A78D6" stroke-width="2.5"/>
    <path d="M100,80 v-4 a8,8 0 0 1 16,0 v4" fill="none" stroke="#2A78D6" stroke-width="2.5"/>
    <text x="70" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#E8EFFB">Unattended login</text>
    <text x="70" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5E7399">email + password, stored locally</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A6B7D8">
      <text x="70" y="204">Cognito → Apigee bearer</text>
      <text x="70" y="232">auto renew · short-lived token</text>
      <text x="70" y="260">rate-limit soft-fail</text>
    </g>
  </g>

  <!-- Stage 2: Sync -->
  <g id="stage-sync">
    <rect x="438" y="40" width="4" height="236" rx="2" fill="#EB6834"/>
    <rect x="442" y="40" width="348" height="236" rx="16" fill="#111A2E" stroke="#1E2A47"/>
    <rect x="488" y="80" width="12" height="22" rx="3" fill="#EB6834" opacity="0.35"/>
    <rect x="504" y="70" width="12" height="32" rx="3" fill="#EB6834" opacity="0.6"/>
    <rect x="520" y="88" width="12" height="14" rx="3" fill="#EB6834" opacity="0.25"/>
    <path d="M518,70 v-16 M518,54 l-6,-7 M518,54 l6,-7" fill="none" stroke="#EB6834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="464" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#E8EFFB">Tiered import</text>
    <text x="464" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5E7399">hourly → daily → monthly</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A6B7D8">
      <text x="464" y="204">pages PGE GraphQL by tier</text>
      <text x="464" y="232">dual-published statistics</text>
      <text x="464" y="260">pge_energy:* + entity mirrors</text>
    </g>
  </g>

  <!-- Stage 3: Live -->
  <g id="stage-live">
    <rect x="828" y="40" width="4" height="236" rx="2" fill="#1BAF7A"/>
    <rect x="832" y="40" width="348" height="236" rx="16" fill="#111A2E" stroke="#1E2A47"/>
    <rect x="880" y="72" width="48" height="34" rx="5" fill="#14203A" stroke="#1BAF7A" stroke-width="2.5"/>
    <rect x="888" y="94" width="9" height="9" rx="2" fill="#1BAF7A" opacity="0.5"/>
    <rect x="900" y="88" width="9" height="15" rx="2" fill="#1BAF7A" opacity="0.8"/>
    <rect x="912" y="80" width="9" height="23" rx="2" fill="#1BAF7A"/>
    <rect x="890" y="110" width="30" height="3" rx="1.5" fill="#1BAF7A" opacity="0.7"/>
    <text x="854" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#E8EFFB">Energy + /pge</text>
    <text x="854" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#5E7399">lives inside Home Assistant</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#A6B7D8">
      <text x="854" y="204">stock HA Energy dashboard</text>
      <text x="854" y="232">first-party PGE panel /pge</text>
      <text x="854" y="260">billing · programs · sync status</text>
    </g>
  </g>

  <!-- Arrows -->
  <line x1="400" y1="158" x2="436" y2="158" stroke="#4A5F85" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="158" x2="826" y2="158" stroke="#4A5F85" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Sync clock footer -->
  <line x1="48" y1="294" x2="1152" y2="294" stroke="#1F2C47" stroke-width="2"/>
  <text x="48" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#6F8BC4">PACIFIC SYNC CLOCK</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#C7D6F2">
    <text x="330" y="322">12am</text>
    <circle cx="330" cy="300" r="3.5" fill="#EB6834"/>
    <text x="414" y="322">4am</text>
    <text x="498" y="322">8am</text>
    <text x="576" y="322">noon</text>
    <text x="654" y="322">4pm</text>
    <text x="738" y="322">8pm</text>
  </g>
  <text x="1152" y="322" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#A6B7D8">PGE publishes once overnight — polling anchors to the Pacific grid</text>
</svg>
