<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="200" viewBox="0 0 1200 200"
     role="img" aria-labelledby="title desc">
  <title id="title">How PGE Energy syncs into Home Assistant</title>
  <desc id="desc">Login, import, billing/TOD, then Energy dashboard and /pge panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#080e1a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" rx="16" fill="url(#bg)"/>

  <text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#E0EAF8">How it works</text>

  <!-- Stage 1 -->
  <rect x="56" y="72" width="220" height="80" rx="10" fill="#0C1320" stroke="#172036"/>
  <rect x="56" y="72" width="220" height="4" rx="2" fill="#2A78D6"/>
  <circle cx="90" cy="100" r="8" fill="none" stroke="#2A78D6" stroke-width="2"/>
  <path d="M87,93 v-2 a3,3 0 0 1 6,0 v2" fill="none" stroke="#2A78D6" stroke-width="2"/>
  <text x="108" y="104" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#E0EAF8">Login</text>
  <text x="166" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3E5678">Cognito → Apigee</text>

  <!-- Arrow -->
  <line x1="284" y1="112" x2="324" y2="112" stroke="#3E5678" stroke-width="2"/>

  <!-- Stage 2 -->
  <rect x="340" y="72" width="220" height="80" rx="10" fill="#0C1320" stroke="#172036"/>
  <rect x="340" y="72" width="220" height="4" rx="2" fill="#EB6834"/>
  <rect x="368" y="94" width="8" height="14" rx="2" fill="#EB6834" opacity="0.4"/>
  <rect x="380" y="88" width="8" height="20" rx="2" fill="#EB6834" opacity="0.7"/>
  <rect x="392" y="96" width="8" height="12" rx="2" fill="#EB6834" opacity="0.3"/>
  <text x="408" y="104" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#E0EAF8">Import</text>
  <text x="450" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3E5678">hourly → daily → monthly</text>

  <!-- Arrow -->
  <line x1="568" y1="112" x2="608" y2="112" stroke="#3E5678" stroke-width="2"/>

  <!-- Stage 3 -->
  <rect x="624" y="72" width="220" height="80" rx="10" fill="#0C1320" stroke="#172036"/>
  <rect x="624" y="72" width="220" height="4" rx="2" fill="#D4A843"/>
  <rect x="652" y="92" width="16" height="20" rx="3" fill="none" stroke="#D4A843" stroke-width="2"/>
  <line x1="656" y1="98" x2="664" y2="98" stroke="#D4A843" stroke-width="1.5"/>
  <line x1="656" y1="104" x2="664" y2="104" stroke="#D4A843" stroke-width="1.5"/>
  <text x="676" y="104" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#E0EAF8">Billing + TOD</text>
  <text x="734" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3E5678">programs · tariffs · PDFs</text>

  <!-- Arrow -->
  <line x1="852" y1="112" x2="892" y2="112" stroke="#3E5678" stroke-width="2"/>

  <!-- Stage 4 -->
  <rect x="908" y="72" width="236" height="80" rx="10" fill="#0C1320" stroke="#172036"/>
  <rect x="908" y="72" width="236" height="4" rx="2" fill="#1BAF7A"/>
  <rect x="936" y="92" width="24" height="18" rx="3" fill="none" stroke="#1BAF7A" stroke-width="2"/>
  <rect x="940" y="102" width="5" height="5" rx="1" fill="#1BAF7A" opacity="0.5"/>
  <rect x="947" y="99" width="5" height="8" rx="1" fill="#1BAF7A" opacity="0.8"/>
  <rect x="954" y="96" width="5" height="11" rx="1" fill="#1BAF7A"/>
  <text x="968" y="104" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#E0EAF8">Energy + /pge</text>
  <text x="1026" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3E5678">dashboard + panel</text>

  <!-- Footer -->
  <line x1="56" y1="170" x2="1144" y2="170" stroke="#172036" stroke-width="1"/>
  <text x="600" y="188" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3E5678">syncs every 4h on Pacific clock · PGE publishes overnight</text>
</svg>
