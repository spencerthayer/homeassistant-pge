refresh:
  name: Refresh
  description: >
    Request an immediate data refresh for one or all PGE Energy entries.
    When billing import is enabled (include_billing), also advances the account
    snapshot, payment/bill ledger page, and programs sync.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. When set, only that entry is refreshed.
      required: false
      selector:
        text:

backfill:
  name: Backfill history
  description: >
    Backfill history for a single config entry using automatic tiering —
    hourly for the newest days, then daily, then monthly for older gaps.
    When billing import is enabled, also pages the bill/payment ledger until
    the Store checkpoint reports complete.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    start_date:
      name: Start date
      description: ISO datetime for the oldest interval to fetch.
      required: true
      selector:
        text:
    end_date:
      name: End date
      description: ISO datetime for the newest interval to fetch.
      required: true
      selector:
        text:

retry_failed_ranges:
  name: Retry failed ranges
  description: Retry failed local calendar days for a single config entry.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:

reset_import_checkpoint:
  name: Reset import checkpoint
  description: Clear persisted backfill/checkpoint state for a single entry (does not delete recorder history).
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:

download_bill_pdf:
  name: Download bill PDF
  description: >
    Download, parse, and import one known statement PDF by bill date from the
    Store index. Does not accept encrypted bill ids in the service call.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    bill_date:
      name: Bill date
      description: Statement date (YYYY-MM-DD) from billing history.
      required: true
      selector:
        text:
    form:
      name: PDF form
      description: Optional detailed or simplified override.
      required: false
      selector:
        select:
          options:
            - detailed
            - simplified
    force:
      name: Force redownload
      description: Redownload even when the retained file hash is valid.
      required: false
      default: false
      selector:
        boolean:

reparse_bill_pdfs:
  name: Reparse bill PDFs
  description: >
    Reparse retained bill PDF files locally without network calls. Useful after
    parser upgrades or to retry reconciliation on a kept file.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    bill_date:
      name: Bill date
      description: Optional single statement (YYYY-MM-DD). Omit to reparse all retained files.
      required: false
      selector:
        text:

set_ptr_event:
  name: Set Peak Time Rebate event
  description: >
    Schedule a manual Peak Time Event window (Pacific time) from the PGE day-before
    email/text notice. The ptr_event_active binary sensor will flip on at the start
    time and off at the end time. Duration must be 1-8 hours.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    start_date:
      name: Start (Pacific)
      description: ISO datetime for the event start (e.g. 2026-08-19T17:00:00-07:00).
      required: true
      selector:
        text:
    end_date:
      name: End (Pacific)
      description: ISO datetime for the event end (e.g. 2026-08-19T21:00:00-07:00).
      required: true
      selector:
        text:
    label:
      name: Label
      description: Optional label for the event (e.g. "Heat wave").
      required: false
      selector:
        text:

clear_ptr_event:
  name: Clear Peak Time Rebate event
  description: Remove the scheduled Peak Time Event window for a config entry.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:

acknowledge_ptr_event:
  name: Acknowledge Peak Time Rebate detection
  description: >
    Acknowledge a detected PTR event date (from GraphQL) so the ptr_event_detected
    binary sensor turns off. Copies the date into the seen set.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
